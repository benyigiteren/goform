<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlk Kurulum — goform</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/static/img/logo.svg" alt="" class="logo">
        <div class="name">goform</div>
      </div>
      <h1>Süper admin hesabı oluştur</h1>
      <p class="sub">İlk kurulum: kaydolan ilk kişi süper admin olur.</p>

      <form id="setupForm" autocomplete="on">
        <div class="field">
          <label class="field-label" for="name">Adınız</label>
          <input type="text" id="name" class="input" autocomplete="name" required minlength="1" placeholder="Ad Soyad">
        </div>
        <div class="field">
          <label class="field-label" for="email">E-posta</label>
          <input type="email" id="email" class="input" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field-label" for="password">Şifre</label>
          <div class="input-wrap">
            <input type="password" id="password" class="input" autocomplete="new-password" required minlength="8">
            <button type="button" class="input-action" data-toggle-pw aria-label="Şifreyi göster"></button>
          </div>
          <div class="field-hint">En az 8 karakter</div>
        </div>
        <div id="errorBox" class="field-error hidden mb-3"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
          <span id="submitText">Süper admin hesabı oluştur</span>
        </button>
      </form>

      <div class="auth-footer">
        Bu hesap tüm sistemi yönetebilir. Daha sonra başka kullanıcılar ekleyebilirsiniz.
      </div>
    </div>
  </div>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script>
    var form = document.getElementById('setupForm');
    var errorBox = document.getElementById('errorBox');
    var btn = document.getElementById('submitBtn');
    var btnText = document.getElementById('submitText');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Oluşturuluyor...';
      try {
        await api('/api/auth/setup', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value.trim(),
            name: document.getElementById('name').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        location.href = '/dashboard';
      } catch (err) {
        errorBox.textContent = err.message || 'Kurulum başarısız';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Süper admin hesabı oluştur';
      }
    });
  </script>
</body>
</html>
