<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yanıtlar — goform</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <div id="headerArea"></div>
    <div class="resp-stats" id="stats"></div>
    <div class="tabs">
      <button class="tab active" data-tab="summary">${Icons.chart} Özet</button>
      <button class="tab" data-tab="responses">${Icons.table} Tüm yanıtlar</button>
    </div>
    <div id="content">
      <div class="center"><span class="spinner spinner-lg"></span></div>
    </div>
  </main>

  <script src="/static/js/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/fields.js"></script>
  <script>
    var formId = location.pathname.split('/').pop();
    var form = null;
    var responses = [];
    var activeTab = 'summary';
    var me = null;

    // Set tab icons
    document.querySelectorAll('.tab').forEach(function (t) {
      var ic = t.dataset.tab === 'summary' ? Icons.chart({ size: 13 }) : Icons.table({ size: 13 });
      t.innerHTML = ic + ' ' + t.textContent.trim().replace(/\$\{[^}]+\}/, '').trim();
    });

    async function init() {
      try { me = await api('/api/auth/me'); }
      catch (e) { location.href = '/login'; return; }

      renderNav({
        user: me,
        actions:
          '<a class="btn" href="/build/' + formId + '">' + Icons.arrowLeft({ size: 14 }) + ' Editöre dön</a>' +
          '<button class="btn" id="downloadBtn">' + Icons.download({ size: 14 }) + ' CSV indir</button>'
      });
      document.getElementById('downloadBtn').onclick = downloadCsv;

      try {
        var data = await Promise.all([
          api('/api/forms/' + formId),
          api('/api/forms/' + formId + '/responses'),
        ]);
        form = data[0];
        responses = data[1];
        renderHeader();
        renderStats();
        renderContent();
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="empty"><h3>Yüklenemedi</h3><p>' + esc(e.message) + '</p></div>';
      }
    }

    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        activeTab = t.dataset.tab;
        renderContent();
      });
    });

    function renderHeader() {
      document.title = (form.title || 'Yanıtlar') + ' — goform';
      document.getElementById('headerArea').innerHTML =
        '<div class="page-header">' +
          '<div>' +
            '<div class="text-muted text-small">Yanıtlar</div>' +
            '<h1>' + esc(form.title) + '</h1>' +
          '</div>' +
          '<div class="row">' +
            '<button class="btn" onclick="copyShare()">' + Icons.link({ size: 14 }) + ' Bağlantı</button>' +
          '</div>' +
        '</div>';
    }

    window.copyShare = function () {
      navigator.clipboard.writeText(location.origin + '/f/' + formId);
      toast('Bağlantı kopyalandı', 'success');
    };

    function renderStats() {
      var last = responses[0];
      var today = responses.filter(function (r) {
        return new Date(r.submittedAt * 1000).toDateString() === new Date().toDateString();
      }).length;
      var fillableFields = form.fields.filter(function (f) { return f.type !== 'section'; }).length;
      document.getElementById('stats').innerHTML =
        '<div class="stat-card"><div class="label">Toplam yanıt</div><div class="value">' + responses.length + '</div></div>' +
        '<div class="stat-card"><div class="label">Bugün</div><div class="value">' + today + '</div></div>' +
        '<div class="stat-card"><div class="label">Soru sayısı</div><div class="value">' + fillableFields + '</div></div>' +
        '<div class="stat-card"><div class="label">Son yanıt</div><div class="value" style="font-size:14px; font-weight:500; padding-top:8px">' + (last ? timeAgo(last.submittedAt) : '—') + '</div></div>';
    }

    function renderContent() {
      var wrap = document.getElementById('content');
      if (responses.length === 0) {
        wrap.innerHTML =
          '<div class="empty">' +
            '<div class="empty-icon">' + Icons.inbox({ size: 24 }) + '</div>' +
            '<h3>Henüz yanıt yok</h3>' +
            '<p>Formunuzu paylaşın, ilk yanıtların gelmesini bekleyin.</p>' +
            '<button class="btn btn-primary" onclick="copyShare()">' + Icons.link({ size: 14 }) + ' Form bağlantısını kopyala</button>' +
          '</div>';
        return;
      }
      if (activeTab === 'summary') renderSummary(wrap);
      else renderResponses(wrap);
    }

    function renderSummary(wrap) {
      var cards = [];
      form.fields.forEach(function (field) {
        if (field.type === 'section') return;
        var vals = responses.map(function (r) { return r.data[field.id]; })
          .filter(function (v) { return v !== undefined && v !== null && v !== ''; });

        if (field.type === 'radio' || field.type === 'dropdown') {
          var counts = {};
          (field.options || []).forEach(function (o) { counts[o] = 0; });
          vals.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
          var total = vals.length;
          cards.push(summaryCard(field.label, total + ' yanıt',
            Object.keys(counts).map(function (opt) {
              var c = counts[opt];
              return barRow(opt, c, total ? c / total * 100 : 0, c + ' (' + (total ? Math.round(c/total*100) : 0) + '%)');
            }).join('')
          ));
        } else if (field.type === 'checkbox') {
          var counts2 = {};
          (field.options || []).forEach(function (o) { counts2[o] = 0; });
          vals.forEach(function (v) {
            if (Array.isArray(v)) v.forEach(function (x) { counts2[x] = (counts2[x] || 0) + 1; });
          });
          var t = vals.length;
          cards.push(summaryCard(field.label, t + ' yanıt',
            Object.keys(counts2).map(function (opt) {
              var c = counts2[opt];
              return barRow(opt, c, t ? c / t * 100 : 0, String(c));
            }).join('')
          ));
        } else if (field.type === 'rating' || field.type === 'scale') {
          var nums = vals.map(Number).filter(function (n) { return !isNaN(n); });
          var avg = nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : 0;
          var smax = field.type === 'rating' ? (field.maxStars || 5) : (field.max == null ? 10 : field.max);
          var smin = field.type === 'rating' ? 1 : (field.min == null ? 1 : field.min);
          var dist = {};
          for (var k = smin; k <= smax; k++) dist[k] = 0;
          nums.forEach(function (n) { dist[n] = (dist[n] || 0) + 1; });
          var rows = Object.keys(dist).map(function (kk) {
            return barRow(kk, dist[kk], nums.length ? dist[kk] / nums.length * 100 : 0, String(dist[kk]));
          }).join('');
          cards.push(summaryCard(field.label,
            nums.length + ' yanıt · Ortalama: <strong style="color:var(--text)">' + avg.toFixed(2) + ' / ' + smax + '</strong>',
            rows
          ));
        } else if (field.type === 'number') {
          var nums2 = vals.map(Number).filter(function (n) { return !isNaN(n); });
          var avg2 = nums2.length ? nums2.reduce(function (a, b) { return a + b; }, 0) / nums2.length : 0;
          var minV = nums2.length ? Math.min.apply(null, nums2) : 0;
          var maxV = nums2.length ? Math.max.apply(null, nums2) : 0;
          cards.push(summaryCard(field.label, nums2.length + ' yanıt',
            '<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px">' +
              '<div><div class="text-small text-muted">Ortalama</div><div style="font-size:18px; font-weight:600">' + avg2.toFixed(2) + '</div></div>' +
              '<div><div class="text-small text-muted">Min</div><div style="font-size:18px; font-weight:600">' + minV + '</div></div>' +
              '<div><div class="text-small text-muted">Max</div><div style="font-size:18px; font-weight:600">' + maxV + '</div></div>' +
            '</div>'
          ));
        } else {
          var recent = vals.slice(0, 8);
          cards.push(summaryCard(field.label, vals.length + ' yanıt',
            '<div class="flex-col">' +
              (recent.length === 0
                ? '<div class="text-muted text-small">Henüz yanıt yok</div>'
                : recent.map(function (v) {
                  return '<div style="padding:8px 12px; background:var(--surface-2); border-radius:6px; font-size:13px">' + esc(v) + '</div>';
                }).join('')) +
              (vals.length > 8 ? '<div class="text-small text-muted">+ ' + (vals.length - 8) + ' tane daha</div>' : '') +
            '</div>'
          ));
        }
      });
      wrap.innerHTML = '<div class="summary-grid">' + cards.join('') + '</div>';
    }

    function summaryCard(title, total, body) {
      return '<div class="summary-card"><h3>' + esc(title) + '</h3><div class="total">' + total + '</div>' + body + '</div>';
    }
    function barRow(label, count, percent, valueText) {
      return '<div class="bar-row">' +
        '<div class="bar-label">' + esc(label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + percent + '%"></div></div>' +
        '<div class="bar-value">' + valueText + '</div>' +
      '</div>';
    }

    function renderResponses(wrap) {
      var fillable = form.fields.filter(function (f) { return f.type !== 'section'; });
      wrap.innerHTML = '<div class="resp-table-wrap"><table class="resp-table"><thead><tr>' +
        '<th style="width:170px">Tarih</th>' +
        fillable.map(function (f) { return '<th title="' + esc(f.label) + '">' + esc(truncate(f.label, 30)) + '</th>'; }).join('') +
        '<th style="width:60px"></th>' +
      '</tr></thead><tbody>' +
      responses.map(function (r) {
        return '<tr data-id="' + r.id + '">' +
          '<td style="color:var(--text-2)">' + formatDateTime(r.submittedAt) + '</td>' +
          fillable.map(function (f) {
            var v = formatValue(r.data[f.id]);
            return '<td title="' + esc(v) + '">' + esc(truncate(v, 40)) + '</td>';
          }).join('') +
          '<td><button class="btn btn-ghost btn-icon btn-sm" data-delete="' + r.id + '" title="Sil">' + Icons.trash({ size: 13 }) + '</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';

      wrap.querySelectorAll('[data-delete]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var ok = await confirmDialog({ title: 'Yanıtı sil', message: 'Bu yanıtı silmek istediğinizden emin misiniz?', confirmText: 'Sil', danger: true });
          if (!ok) return;
          try {
            await api('/api/responses/' + btn.dataset.delete, { method: 'DELETE' });
            toast('Yanıt silindi', 'success');
            init();
          } catch (e) { toast(e.message, 'error'); }
        });
      });
    }

    function formatValue(v) {
      if (v === undefined || v === null || v === '') return '—';
      if (Array.isArray(v)) return v.join(', ');
      return String(v);
    }
    function truncate(s, n) {
      s = String(s);
      return s.length > n ? s.slice(0, n - 1) + '…' : s;
    }

    function downloadCsv() {
      if (responses.length === 0) { toast('İndirilecek yanıt yok', 'error'); return; }
      var fillable = form.fields.filter(function (f) { return f.type !== 'section'; });
      var headers = ['Tarih'].concat(fillable.map(function (f) { return f.label; }));
      var rows = responses.map(function (r) {
        return [formatDateTime(r.submittedAt)].concat(fillable.map(function (f) { return formatValue(r.data[f.id]); }));
      });
      var csv = [headers].concat(rows).map(function (row) {
        return row.map(function (c) {
          var s = String(c == null ? '' : c);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\n');
      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (form.title || 'yanitlar').replace(/[^\wğüşıöçĞÜŞİÖÇ\s-]/g, '_') + '_yanitlar.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
